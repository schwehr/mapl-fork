[project]
# Project metadata. Available keys are documented at:
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata
name = "mapl"
description = "Methane Analysis and Plume Localization (MAPL): A library for detecting and analyzing methane plumes from hyperspectral EMIT data."
readme = "README.md"
requires-python = ">=3.13, <3.14"
license = {file = "LICENSE"}
authors = [{name="EOScience Team", email = "eoscience-eng@google.com"}]
classifiers = [  # List of https://pypi.org/classifiers/
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.13",
]
keywords = []

# pip dependencies of the project
# Installed locally with `pip install -e .`
dependencies = [
    "absl-py",
    "apache-beam[gcp]",
    "dataclasses-json",
    "earthengine-api",
    "jax",
    "matplotlib",
    "ml_collections",
    "netCDF4",
    "numpy",
    "pandas",
    "pyproj",
    "python-dateutil",
    "rasterio",
    "shapely",
    "scikit-learn",
    "tensorflow",
    "tensorflow_datasets",
    "toolz",
    "utm",
    "xarray",
]

# `version` is automatically set by flit to use `mapl.__version__`
dynamic = ["version"]

[project.urls]
homepage = "https://github.com/google-research/mapl"
repository = "https://github.com/google-research/mapl"
changelog = "https://github.com/google-research/mapl/blob/main/CHANGELOG.md"


[project.optional-dependencies]
# Installed through `pip install -e .[dev]`
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pylint>=2.6.0",
    "pyink",
]
# Installed through `pip install '.[docs]'`.
docs = [
    # Install `apitree` with all extensions (sphinx, theme,...)
    "sphinx-apitree[ext]",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-xdist",
    "pylint>=2.6.0",
    "pyink",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["*_test.py"]
addopts = "--cov=mapl --cov-report=term-missing"

[tool.coverage.run]
source = ["mapl"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.pyink]


# Formatting configuration to follow Google style-guide
line-length = 80
unstable = true
pyink-indentation = 2
pyink-use-majority-quotes = true

[tool.ruff]
line-length = 80

[tool.ruff.lint]
ignore = [
    "C408",     # Unnecessary `dict()` call (rewrite as a literal)
    "E731",     # Do not assign a lambda expression, use a def
    "FURB132",  # Use `discard` instead of check and `remove`
    "I001",     # Import block is un-sorted or un-formatted
    "PYI041",   # Use `float` instead of `int | float`
    "RUF015",   # Prefer `next(iter(...))` over single element slice
    "UP006",    # Use `type`/`tuple` instead of `Type`/`Tuple` for type annotation
    "UP031",    # Use format specifiers instead of percent format
    "UP035",    # Deprecated typing imports
    "UP045",    # Use `X | None` for type annotations
]

[build-system]
# Build system specify which backend is used to build/install the project (flit,
# poetry, setuptools,...). All backends are supported by `pip install`
requires = ["flit_core >=3.8,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.sdist]
# Flit specific options (files to exclude from the PyPI package).
# If using another build backend (setuptools, poetry), you can remove this
# section.
exclude = [
  # Do not release tests files on PyPI.
  "**/*_test.py",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[tool.pyrefly.errors]
bad-argument-type = "ignore"
bad-assignment = "ignore"
bad-index = "ignore"
bad-keyword-argument = "ignore"
invalid-argument = "ignore"
missing-attribute = "ignore"
missing-import = "ignore"
not-a-type = "ignore"
not-iterable = "ignore"
unexpected-keyword = "ignore"
unsupported-operation = "ignore"

[tool.codespell]
skip = "*.lock"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
